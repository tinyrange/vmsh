Section "ServerLayout"
    Identifier "vmsh"
    Screen 0 "vmsh-screen"
EndSection

Section "Device"
    Identifier "vmsh-virtio-gpu"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection

Section "Monitor"
    Identifier "vmsh-monitor"
EndSection

Section "Screen"
    Identifier "vmsh-screen"
    Device "vmsh-virtio-gpu"
    Monitor "vmsh-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1440x900"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
