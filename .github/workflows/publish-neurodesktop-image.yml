name: Publish Neurodesktop image

on:
  workflow_dispatch:
    inputs:
      neurocontainers_ref:
        description: Neurocontainers branch, tag, or commit to build
        required: true
        default: main
        type: string
      tag:
        description: GHCR image tag
        required: true
        default: edge
        type: string
      publish_latest:
        description: Also update the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: neurodesktop-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neurodesktop-glass

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - architecture: aarch64
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Validate tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid container tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Reclaim runner disk space
        run: |
          set -euo pipefail
          for path in \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          do
            if [[ -d "$path" ]]; then
              sudo find "$path" -mindepth 1 -depth -delete
            fi
          done
          docker system prune --all --force
          df -h /

      - name: Checkout Neurocontainers
        uses: actions/checkout@v6
        with:
          repository: neurodesk/neurocontainers
          ref: ${{ inputs.neurocontainers_ref }}
          path: neurocontainers
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neurocontainers/pyproject.toml

      - name: Install Neurocontainers builder
        run: python -m pip install ./neurocontainers

      - name: Restore download cache
        uses: actions/cache@v5
        with:
          path: neurocontainers/httpcache
          key: neurodesktop-http-${{ matrix.architecture }}-${{ hashFiles('neurocontainers/recipes/neurodesktop-lite/build.yaml') }}
          restore-keys: |
            neurodesktop-http-${{ matrix.architecture }}-

      - name: Generate architecture-specific build context
        id: context
        working-directory: neurocontainers
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python -m builder stage neurodesktop-lite \
            --architecture "$ARCHITECTURE" \
            --option glass=true \
            --recreate \
            --download
          dockerfile="$(find build/neurodesktop-lite -maxdepth 1 -iname '*.dockerfile' -print -quit)"
          if [[ -z "$dockerfile" ]]; then
            echo "::error::Neurocontainers did not generate a Dockerfile"
            exit 1
          fi
          echo "dockerfile=neurocontainers/$dockerfile" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: neurocontainers/build/neurodesktop-lite
          file: ${{ steps.context.outputs.dockerfile }}
          build-contexts: |
            neurocontainer-cache=neurocontainers/build/neurodesktop-lite/cache
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Neurodesktop Glass
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.suffix }},mode=max,ignore-error=true

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish manifest
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          sources=(
            "$IMAGE:${IMAGE_TAG}-amd64"
            "$IMAGE:${IMAGE_TAG}-arm64"
          )
          docker buildx imagetools create \
            --tag "$IMAGE:$IMAGE_TAG" \
            "${sources[@]}"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            docker buildx imagetools create \
              --tag "$IMAGE:latest" \
              "${sources[@]}"
          fi
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG"
