name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version string to use in artifact names, for example v0.1.0-rc.1
        required: true
        default: v0.0.0-dryrun
      publish:
        description: Publish a GitHub Release after building artifacts
        type: boolean
        required: true
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-unix-windows:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            build_desktops: true
          - goos: linux
            goarch: arm64
            build_desktops: false
          - goos: windows
            goarch: amd64
            ext: .exe
            build_desktops: true
          - goos: windows
            goarch: arm64
            ext: .exe
            build_desktops: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cc/go.sum

      - name: Build release payload
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXE: ${{ matrix.ext }}
          BUILD_DESKTOPS: ${{ matrix.build_desktops }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          vmsh_name="vmsh_${version}_${GOOS}_${GOARCH}${EXE}"
          app_name="NeurodeskAppX_${version}_${GOOS}_${GOARCH}${EXE}"
          squadvm_name="SquadVM_${version}_${GOOS}_${GOARCH}${EXE}"
          mkdir -p dist build/release

          cd cc
          env -u GOOS -u GOARCH go run ./internal/cmd/build-guestinit -arch "$GOARCH"
          cd ..
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-X github.com/tinyrange/vmsh/internal/version.Release=${version} -X github.com/tinyrange/vmsh/internal/version.Commit=${GITHUB_SHA} -X github.com/tinyrange/vmsh/internal/version.Dirty=false -X github.com/tinyrange/vmsh/internal/version.BuildDate=${build_date}"
          GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -trimpath -ldflags "$ldflags" -o "dist/${vmsh_name}" ./cmd/vmsh
          if [[ "$BUILD_DESKTOPS" == "true" ]]; then
            desktop_ldflags="$ldflags"
            if [[ "$GOOS" == "windows" ]]; then
              desktop_ldflags="$desktop_ldflags -H=windowsgui"
            fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags "$desktop_ldflags" \
              -o "dist/${app_name}" \
              ./cmd/ndappx
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags "$desktop_ldflags" \
              -o "dist/${squadvm_name}" \
              ./cmd/squadvm
          fi

      - name: Verify embedded guest init payloads
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          cd cc
          go test \
            ./internal/guestinit \
            ./internal/freebsd/guestinit \
            ./internal/netbsd/guestinit \
            ./internal/openbsd/guestinit

      - name: Smoke-test native Linux payload
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          name="vmsh_${RELEASE_VERSION}_linux_amd64"
          output="$("dist/${name}" --version)"
          grep -F "vmsh version ${RELEASE_VERSION}" <<<"$output"
          grep -F "platform linux/amd64" <<<"$output"
          grep -F "ccvm bundled" <<<"$output"
          app_name="NeurodeskAppX_${RELEASE_VERSION}_linux_amd64"
          "dist/${app_name}" --help 2>&1 | grep -F "Usage of NeurodeskAppX"
          squadvm_name="SquadVM_${RELEASE_VERSION}_linux_amd64"
          "dist/${squadvm_name}" --help 2>&1 | grep -F "Usage of SquadVM"

      - name: Verify Windows desktop subsystem
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          name="NeurodeskAppX_${RELEASE_VERSION}_windows_amd64.exe"
          objdump -p "dist/${name}" |
            grep -E 'Subsystem[[:space:]]+00000002[[:space:]]+[(]Windows GUI[)]'
          objdump -h "dist/${name}" |
            grep -E '[[:space:]][.]rsrc[[:space:]]'
          name="SquadVM_${RELEASE_VERSION}_windows_amd64.exe"
          objdump -p "dist/${name}" |
            grep -E 'Subsystem[[:space:]]+00000002[[:space:]]+[(]Windows GUI[)]'
          objdump -h "dist/${name}" |
            grep -E '[[:space:]][.]rsrc[[:space:]]'

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vmsh-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/vmsh_${{ env.RELEASE_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
            dist/NeurodeskAppX_${{ env.RELEASE_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
            dist/SquadVM_${{ env.RELEASE_VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  build-macos:
    name: Build signed macOS ARM64
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID || secrets.DEVELOPER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cc/go.sum

      - name: Check macOS signing and notarization secrets
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_DEVELOPER_ID APPLE_ID_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [[ "$APPLE_ID_PASSWORD" != @keychain:* ]]; then
            for name in APPLE_ID TEAM_ID; do
              if [ -z "${!name}" ]; then
                missing+=("$name")
              fi
            done
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required macOS release secrets:\n' >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > certificate.p12
          trap "rm -f certificate.p12" EXIT
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Build macOS payload
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          vmsh_name="vmsh_${version}_darwin_arm64"
          app="dist/NeurodeskAppX.app"
          squad_app="dist/SquadVM.app"
          mkdir -p \
            dist \
            build/release \
            "$app/Contents/MacOS" \
            "$app/Contents/Resources" \
            "$squad_app/Contents/MacOS" \
            "$squad_app/Contents/Resources"

          cd cc
          go run ./internal/cmd/build-guestinit -arch arm64
          cd ..
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-X github.com/tinyrange/vmsh/internal/version.Release=${version} -X github.com/tinyrange/vmsh/internal/version.Commit=${GITHUB_SHA} -X github.com/tinyrange/vmsh/internal/version.Dirty=false -X github.com/tinyrange/vmsh/internal/version.BuildDate=${build_date}"
          GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "$ldflags" -o "dist/${vmsh_name}" ./cmd/vmsh
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "$ldflags" \
            -o "$app/Contents/MacOS/NeurodeskAppX" \
            ./cmd/ndappx
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "$ldflags" \
            -o "$squad_app/Contents/MacOS/SquadVM" \
            ./cmd/squadvm

          cp cmd/ndappx/macos/Info.plist "$app/Contents/Info.plist"
          cp cmd/squadvm/macos/Info.plist "$squad_app/Contents/Info.plist"
          bundle_version="$(printf '%s' "$version" | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')"
          if [[ -z "$bundle_version" ]]; then
            bundle_version="0.0.0"
          fi
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $bundle_version" \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $bundle_version" \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$squad_app/Contents/Info.plist"

          iconset="build/release/NeurodeskAppX.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" cmd/ndappx/assets/neurodesk-icon.png \
              --out "$iconset/icon_${size}x${size}.png"
            sips -z "$double" "$double" cmd/ndappx/assets/neurodesk-icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/NeurodeskAppX.icns"

          squad_iconset="build/release/SquadVM.iconset"
          mkdir -p "$squad_iconset"
          for size in 16 32 128 256 512; do
            double=$((size * 2))
            sips -z "$size" "$size" cmd/squadvm/assets/squadvm-icon.png \
              --out "$squad_iconset/icon_${size}x${size}.png"
            sips -z "$double" "$double" cmd/squadvm/assets/squadvm-icon.png \
              --out "$squad_iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$squad_iconset" -o "$squad_app/Contents/Resources/SquadVM.icns"

      - name: Verify embedded guest init payloads
        run: |
          set -euo pipefail
          cd cc
          go test \
            ./internal/guestinit \
            ./internal/freebsd/guestinit \
            ./internal/netbsd/guestinit \
            ./internal/openbsd/guestinit

      - name: Sign macOS binaries
        run: |
          set -euo pipefail
          codesign \
            --force \
            --sign "$MACOS_DEVELOPER_ID" \
            --entitlements tools/entitlements.xml \
            --timestamp \
            --options runtime \
            --keychain build.keychain \
            "dist/vmsh_${RELEASE_VERSION}_darwin_arm64"
          codesign \
            --force \
            --sign "$MACOS_DEVELOPER_ID" \
            --entitlements tools/entitlements.xml \
            --timestamp \
            --options runtime \
            --keychain build.keychain \
            "dist/NeurodeskAppX.app/Contents/MacOS/NeurodeskAppX"
          codesign \
            --force \
            --sign "$MACOS_DEVELOPER_ID" \
            --entitlements tools/entitlements.xml \
            --timestamp \
            --options runtime \
            --keychain build.keychain \
            "dist/NeurodeskAppX.app"
          codesign \
            --force \
            --sign "$MACOS_DEVELOPER_ID" \
            --entitlements tools/entitlements.xml \
            --timestamp \
            --options runtime \
            --keychain build.keychain \
            "dist/SquadVM.app/Contents/MacOS/SquadVM"
          codesign \
            --force \
            --sign "$MACOS_DEVELOPER_ID" \
            --entitlements tools/entitlements.xml \
            --timestamp \
            --options runtime \
            --keychain build.keychain \
            "dist/SquadVM.app"
          codesign --verify --deep --strict --verbose=2 "dist/NeurodeskAppX.app"
          codesign --verify --deep --strict --verbose=2 "dist/SquadVM.app"
          codesign --verify --strict --verbose=2 "dist/vmsh_${RELEASE_VERSION}_darwin_arm64"
          codesign -d --verbose=4 "dist/NeurodeskAppX.app" 2>&1 | grep runtime
          codesign -d --verbose=4 "dist/SquadVM.app" 2>&1 | grep runtime
          app_entitlements="$(mktemp)"
          trap 'rm -f "$app_entitlements"' EXIT
          codesign -d --entitlements :- "dist/NeurodeskAppX.app" > "$app_entitlements"
          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.hypervisor' \
            "$app_entitlements")" = true
          codesign -d --entitlements :- "dist/SquadVM.app" > "$app_entitlements"
          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.hypervisor' \
            "$app_entitlements")" = true

      - name: Notarize macOS binary
        run: |
          set -euo pipefail
          notary_dir="build/release/notary"
          notary_zip="build/release/desktop_apps_vmsh_notary.zip"
          notary_result="$(mktemp)"
          trap 'rm -f "$notary_zip" "$notary_result"' EXIT
          rm -rf "$notary_dir"
          mkdir -p "$notary_dir"
          cp \
            "dist/vmsh_${RELEASE_VERSION}_darwin_arm64" \
            "$notary_dir/"
          ditto "dist/NeurodeskAppX.app" "$notary_dir/NeurodeskAppX.app"
          ditto "dist/SquadVM.app" "$notary_dir/SquadVM.app"
          ditto -c -k --keepParent "$notary_dir" "$notary_zip"

          if [[ "$APPLE_ID_PASSWORD" == @keychain:* ]]; then
            notary_profile="${APPLE_ID_PASSWORD#@keychain:}"
            xcrun notarytool submit "$notary_zip" \
              --keychain-profile "$notary_profile" \
              --wait \
              --timeout 30m \
              --output-format plist > "$notary_result"
          else
            xcrun notarytool submit "$notary_zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$TEAM_ID" \
              --wait \
              --timeout 30m \
              --output-format plist > "$notary_result"
          fi

          test "$(plutil -extract status raw -o - "$notary_result")" = Accepted
          codesign --verify --strict --verbose=2 "dist/vmsh_${RELEASE_VERSION}_darwin_arm64"
          codesign --verify --deep --strict --verbose=2 "dist/NeurodeskAppX.app"
          codesign --verify --deep --strict --verbose=2 "dist/SquadVM.app"
          xcrun stapler staple "dist/NeurodeskAppX.app"
          xcrun stapler validate "dist/NeurodeskAppX.app"
          xcrun stapler staple "dist/SquadVM.app"
          xcrun stapler validate "dist/SquadVM.app"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/NeurodeskAppX.app" \
            "dist/NeurodeskAppX_${RELEASE_VERSION}_darwin_arm64.zip"
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/SquadVM.app" \
            "dist/SquadVM_${RELEASE_VERSION}_darwin_arm64.zip"

      - name: Smoke-test signed macOS payload
        run: |
          set -euo pipefail
          name="vmsh_${RELEASE_VERSION}_darwin_arm64"
          output="$("dist/${name}" --version)"
          grep -F "vmsh version ${RELEASE_VERSION}" <<<"$output"
          grep -F "platform darwin/arm64" <<<"$output"
          grep -F "ccvm bundled" <<<"$output"
          "dist/NeurodeskAppX.app/Contents/MacOS/NeurodeskAppX" --help 2>&1 |
            grep -F "Usage of NeurodeskAppX"
          "dist/SquadVM.app/Contents/MacOS/SquadVM" --help 2>&1 |
            grep -F "Usage of SquadVM"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vmsh-darwin-arm64
          path: |
            dist/vmsh_${{ env.RELEASE_VERSION }}_darwin_arm64
            dist/NeurodeskAppX_${{ env.RELEASE_VERSION }}_darwin_arm64.zip
            dist/SquadVM_${{ env.RELEASE_VERSION }}_darwin_arm64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-unix-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          set -euo pipefail
          find artifacts -type f \( -name 'vmsh_*' -o -name 'NeurodeskAppX_*' -o -name 'SquadVM_*' \) -print0 |
            sort -z |
            xargs -0 sha256sum |
            sed 's#artifacts/[^/]*/##' > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: vmsh-checksums
          path: checksums.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          body_path: RELEASENOTES.md
          files: |
            artifacts/**/vmsh_*
            artifacts/**/NeurodeskAppX_*
            artifacts/**/SquadVM_*
            checksums.txt

      - name: Refresh website release data
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
